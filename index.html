<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neruvy's Links</title>
    <link rel="icon" type="image/png" href="picture.jpg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(180deg, #000 0%, #1a1a1a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 480px;
            width: 100%;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }

        .profile {
            text-align: center;
            margin-bottom: 32px;
        }

        .profile-image {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: #fff;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }

        .profile h1 {
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .profile p {
            color: #fff;
            font-size: 14px;
            font-weight: 400;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 24px;
            background: transparent;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            transition: all 0.2s ease;
            border: 1px solid #fff;
            min-height: 56px;
        }

        .link-button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .link-button:active {
            transform: scale(0.98);
        }

        @media (max-width: 600px) {
            .container {
                padding: 32px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile">
            <img src="picture.jpg" class="profile-image" alt="picture thing">
            <h1>@Neruvy</h1>
            <p>.. ... .-. .- . .-.. / .. ... / .-- .- - -.-. .... .. -. --.</p>
        </div>
        
        <div class="links">
            <a href="https://tiktok.com/@Neruvy" class="link-button">TikTok</a>
            <a href="https://www.instagram.com/neruvyy/" class="link-button">Instagram</a>
            <a href="https://youtube.com/@Neruvy/" class="link-button">YouTube</a>
            <a href="https://github.com/Neruvy" class="link-button">GitHub</a>
            <a href="https://neruvy.github.io/Eaglercraft" class="link-button">Eaglercraft</a>
            <a href="https://funkin-html-port.vercel.app/" class="link-button">Friday Night Funkin' Web Port</a>
            <a href="https://neruvy.github.io/morse-code-translator/" class="link-button">Morse Code Translator</a>
        </div>
    </div>
</body>
</html>
